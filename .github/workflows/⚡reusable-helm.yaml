name: ⚡ Reusable Helm

on:
  workflow_call:
    inputs:
      atomi_platform:
        required: true
        type: string
      atomi_service:
        required: true
        type: string
      chart_path:
        required: true
        type: string
      version:
        required: true
        type: string
jobs:
  build:
    name: Build Helm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.version != '' && inputs.version == github.ref_name
    permissions:
      contents: read
      packages: write
    runs-on:
      - ubuntu-22.04
      # - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      # - nscloud-cache-size-50gb
      # - nscloud-cache-tag-${{ inputs.atomi_platform }}-${{ inputs.atomi_service }}-nix-store-cache

    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v2
        with:
          namespacelabs: 'false'

      # Action
      - name: Build and Push Helm
        run: nix develop .#ci -c ./scripts/ci/helm.sh "$CHART_PATH" "$RELEASE_VERSION"
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          RELEASE_VERSION: ${{ inputs.version }}
          # registry
          DOMAIN: ghcr.io

          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USER: ${{ github.actor }}

          # downwards API
          GITHUB_REPO_REF: ${{ github.repository }}
