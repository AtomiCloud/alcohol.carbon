name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  precommit:
    name: Pre-Commit
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    with:
      atomi_platform: alcohol
      atomi_service: carbon
  #
  #
  helm:
    name: Helm Chart
    runs-on: ubuntu-22.04
    steps:
      - uses: AtomiCloud/actions.setup-nix@v2
        with:
          namespacelabs: 'false'
      # This path never invokes the publisher or receives registry credentials.
      - name: Build Helm locally
        run: |
          nix develop .#ci -c bash -euo pipefail <<'BUILD'
          helm dependency build chart
          helm lint chart
          helm template branch-ci chart > /dev/null
          helm package chart --destination "$RUNNER_TEMP/helm"
          BUILD
  deploy-test:
    name: Deploy Test
    uses: ./.github/workflows/⚡reusable-deploy-test.yaml
  #
