serviceTree: &serviceTree
  landscape: &landscape pichu

tags: &tags
  atomi.cloud/landscape: *landscape

lithium:
  serviceTree:
    <<: *serviceTree
  tags:
    <<: *tags

  bromine:
    serviceTree:
      <<: *serviceTree

  ingress:
    hosts:
      - host: api.lithium.alcohol.pichu.cluster.atomi.cloud
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - api.lithium.alcohol.pichu.cluster.atomi.cloud
        secretName: api-lithium-alcohol-pichu-tls
  adminIngress:
    enabled: false
    hosts:
      - host: admin.lithium.alcohol.pichu.cluster.atomi.cloud
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - admin.lithium.alcohol.pichu.cluster.atomi.cloud
        secretName: admin-lithium-alcohol-pichu-tls

  replicaCount: 1

  maincache: {}

  app:
    endpoint: "https://api.lithium.alcohol.pichu.cluster.atomi.cloud"
    adminEndpoint: "https://admin.lithium.alcohol.pichu.atomi.cloud"

zinc:
  serviceTree:
    <<: *serviceTree

  bromine:
    serviceTree:
      <<: *serviceTree


  api:
    serviceTree:
      <<: *serviceTree
    replicaCount: 1
    # Change this value to restart zinc-api so it re-reads secrets added in Infisical: the
    # cluster copies them about once an hour, and the server reads them only at start-up.
    podAnnotations:
      atomi.cloud/secrets-reloaded: '2026-11-12-strava'
    service:
      type: ClusterIP
      port: 80
      containerPort: 9050
    ingress:
      hosts:
        - host: api.zinc.alcohol.pichu.cluster.atomi.cloud
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - api.zinc.alcohol.pichu.cluster.atomi.cloud
          secretName: api-zinc-alcohol-pichu-tls
  migration:
    serviceTree:
      <<: *serviceTree